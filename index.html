<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dominion Forger</title>
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#7a2e0e">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Dominion Forger">
	<link rel="apple-touch-icon" href="/dominion-forger/images/website_icons/DFlogo-192.jpg">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div id="app">

		<!-- Overlay -->
		<div id="drawer-overlay"></div>

		<!-- Drawer -->
		<nav id="drawer">
			<div id="drawer-header">
				<a class="site-title" id="drawer-title" href="/dominion-forger/">Dominion <span>Forger</span></a>
				<button id="drawer-close" aria-label="Close menu">✕</button>
			</div>
			<div id="drawer-links"></div>
			<div id="drawer-footer-links"></div>
		</nav>

		<!-- Header -->
		<header>
			<button id="hamburger" aria-label="Open menu">
				<span></span><span></span><span></span>
			</button>
			<a class="site-title" href="/dominion-forger/">Dominion <span>Forger</span></a>
			<form id="header-search" class="desktop-search">
				<input id="search-input" placeholder="Search cards...">
			</form>
			<button id="search-toggle" aria-label="Search">
				<img src="/dominion-forger/images/website_icons/search_icon.svg" alt="Search">
			</button>
		</header>
		<div id="mobile-search-bar">
			<form id="mobile-search-form">
				<input id="mobile-search-input" placeholder="Search cards...">
			</form>
		</div>

		<main id="main"></main>

		<footer>
			<span>Dominion Forger</span>
			<span>
				Dominion Forger is an independent fan-created tool.
			</span>
		</footer>
	</div>
	<script src="js/pages/home.js"></script>
	<script src="js/pages/randomizer.js"></script>
	<script src="js/pages/browse.js"></script>
	<script src="js/pages/expansions.js"></script>
	<script src="js/pages/kingdoms.js"></script>
	<script src="js/pages/statistics.js"></script>
	<script src="js/pages/help.js"></script>
	<script src="js/pages/feedback.js"></script>
	<script src="js/pages/about.js"></script>
	<script src="js/pages/search.js"></script>
	<script src="js/pages/card.js"></script>
	<script src="js/render.js"></script>
	<script src="js/router.js"></script>
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				const swPath = location.hostname === 'localhost'
					? '/sw.js'
					: '/dominion-forger/sw.js';
				navigator.serviceWorker.register(swPath)
					.then(() => navigator.storage.persist())
					.catch(err => console.warn('SW registration failed:', err));
			});
		}
	</script>
</body>
</html>
